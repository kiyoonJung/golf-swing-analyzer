<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A14" media="(prefers-color-scheme: dark)">
<title>스윙픽서</title>
<link rel="stylesheet" href="src/css/style.css">
<script>try{var t=localStorage.getItem('swingfixer:theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script> <!-- 화면 모드: 첫 화면 깜빡임 방지 (theme.js 와 같은 키) -->
<!-- [B 게이트] 로그인 확인이 끝나기 전에는 홈 화면을 가린다. gate.js 가 data-gate 를 locked/open 으로 바꾼다.
     gate.js 를 아예 못 불러와도 8초 뒤에는 화면을 연다(앱이 잠기지 않게). -->
<style>html[data-gate="pending"] #app, html[data-gate="locked"] #app { visibility: hidden; }</style>
<script>
  document.documentElement.dataset.gate = 'pending';
  setTimeout(function () { if (document.documentElement.dataset.gate === 'pending') document.documentElement.dataset.gate = 'open'; }, 8000);
</script>
  <script>
    /* 가로 모드 감지: 화면이 가로이고 낮으면(폰을 눕힌 상태) <html class="land"> 를 붙인다. CSS 미디어쿼리 대신 직접 재서, 앱 안 브라우저(카카오톡 등)에서도 맞게 동작.
       아이폰은 방향이 바뀐 직후 화면 크기를 늦게 알려주므로 몇 번 더 다시 잰다. */
    (function () {
      var h = document.documentElement;
      function f() {
        var w = window.innerWidth, ht = window.innerHeight;
        var touch = (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
        h.classList.toggle('land', w > ht && ht <= 520 && touch);
      }
      function later() { f(); setTimeout(f, 150); setTimeout(f, 450); setTimeout(f, 1000); }
      f();
      addEventListener('resize', f);
      addEventListener('orientationchange', later);
      if (window.visualViewport) visualViewport.addEventListener('resize', f);
    })();
  </script>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/main.js"></script>
<script type="module" src="src/gate.js"></script>
</body>
</html>
